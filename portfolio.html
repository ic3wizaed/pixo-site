<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نمونه‌کارها</title>
  <style>
    body {
      background-color: #000000;
      color: #f2f2f2;
      font-family: Tahoma, Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 40px 20px;
    }
    h1 {
      color: #c9a96e;
      font-size: 40px;
    }
    p {
      color: #bbbbbb;
      font-size: 18px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      max-width: 1100px;
      margin: 40px auto;
    }
    .item {
      background-color: #141414;
      border-radius: 12px;
      padding: 12px;
      transition: transform 0.8s;
    }
    .item:hover {
      transform: translateY(-6px);
    }
    .item img {
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      border-radius: 8px;
    }
    .item h3 {
      margin: 12px 0 4px;
    }
    .tag {
      color: #888888;
      font-size: 14px;
    }
    a {
      color: #c9a96e;
    }
  </style>
</head>
<body>
  <h1>نمونه‌کارهای علی</h1>
  <p>عکس‌های تبلیغاتی محصول</p>

  <div class="gallery">
    <div class="item">
      <img src="shoe.jpg" alt="عکس تبلیغاتی کفش">
      <h3>کفش چرمی</h3>
      <p class="tag">کار تمرینی</p>
    </div>
    <div class="item">
      <img src="watch.webp" alt="عکس تبلیغاتی ساعت">
      <h3>ساعت</h3>
      <p class="tag">کار تمرینی</p>
    </div>
    <div class="item">
      <img src="bag.jpg" alt="عکس تبلیغاتی کیف">
      <h3>کیف چرمی</h3>
      <p class="tag">کار تمرینی</p>
    </div>
    <div class="item">
      <img src="perfume.jpg" alt="عکس تبلیغاتی ادکلن">
      <h3>ادکلن</h3>
      <p class="tag">کار تمرینی</p>
    </div>
    <div class="item">
      <img src="tshirt.jpg" alt="عکس تبلیغاتی تیشرت">
      <h3>تیشرت</h3>
      <p class="tag">کار تمرینی</p>
    </div>
  </div>

  <a href="index.html">بازگشت به صفحه‌ی اصلی</a>
</body>
</html>
